services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      # Mount host home at SAME path in container so absolute paths stored in
      # ~/.claude/claude-dashboard.config.json (scanPaths, excludePaths) still
      # resolve. HOME env is set to match so os.homedir() returns the host path.
      - ${HOME}:${HOME}
    environment:
      - HOME=${HOME}
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
  next_cache:
